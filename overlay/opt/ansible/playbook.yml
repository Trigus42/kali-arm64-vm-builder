---
# Idempotent system CONFIG applied inside the target rootfs during the build.
#
# Ownership boundary (kept strict to avoid doing the same thing twice):
#   - This playbook: services, group membership, shells, file perms, dotfile
#     placement, autostart removal — anything needing idempotent config logic.
#   - overlay/:                    static config files (dropped verbatim).
#   - scripts/third-party-install.sh: non-apt installs (docker/vscode/starship…).
#   - config.sh PACKAGES (via debos): plain Kali apt packages.
#
# Run locally in the chroot: ansible-playbook -c local -i 'localhost,' playbook.yml -e target_user=kali

- name: Kali custom VM customizations
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_user: kali
  tasks:
    - name: Ensure .config dirs exist for dotfiles
      ansible.builtin.file:
        path: "{{ item.home }}/.config"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0755"
      loop:
        - { home: "/home/{{ target_user }}", owner: "{{ target_user }}" }
        - { home: "/root", owner: "root" }

    - name: Ensure passwordless sudo file has correct permissions
      # The file itself is shipped by the overlay; enforce 0440 so sudo trusts it.
      ansible.builtin.file:
        path: /etc/sudoers.d/kali-nopasswd
        owner: root
        group: root
        mode: "0440"

    - name: Validate the sudoers drop-in parses
      ansible.builtin.command: visudo -cf /etc/sudoers.d/kali-nopasswd
      changed_when: false

    - name: Ensure sshd_config ships with key-only auth (shipped via overlay)
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"

    - name: Ensure the primary user's .ssh dir exists
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"

    - name: Set default shell to zsh for the primary user
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /usr/bin/zsh

    - name: Set default shell to zsh for root
      ansible.builtin.user:
        name: root
        shell: /usr/bin/zsh

    - name: Place dotfiles for the primary user and root
      # Shipped into /etc/skel by the overlay; copy to the already-created
      # accounts (skel is only applied at useradd time).
      ansible.builtin.copy:
        src: "/etc/skel/{{ item.file }}"
        dest: "{{ item.home }}/{{ item.file }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0644"
      loop:
        - { home: "/home/{{ target_user }}", owner: "{{ target_user }}", file: ".zshrc" }
        - { home: "/home/{{ target_user }}", owner: "{{ target_user }}", file: ".config/starship.toml" }
        - { home: "/root", owner: "root", file: ".zshrc" }
        - { home: "/root", owner: "root", file: ".config/starship.toml" }

    - name: Ensure the primary user is in the docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    - name: Enable ssh service on boot
      ansible.builtin.systemd_service:
        name: ssh.service
        enabled: true
      failed_when: false

    - name: Enable docker service on boot
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
      failed_when: false

    - name: Disable desktop screensaver / locker / power autostarts
      ansible.builtin.file:
        path: "/etc/xdg/autostart/{{ item }}"
        state: absent
      loop:
        - xfce4-screensaver.desktop
        - light-locker.desktop
        - xfce4-power-manager.desktop
